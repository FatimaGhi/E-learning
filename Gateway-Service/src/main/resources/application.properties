spring.application.name=Gateway-Service

# Server port
server.port=9090

# Consul config
spring.cloud.consul.host=localhost
spring.cloud.consul.port=8500
spring.cloud.consul.discovery.register=true


# Gateway DEBUG logs
logging.level.org.springframework.cloud.gateway=DEBUG
logging.level.org.springframework.cloud.client=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.security=DEBUG

logging.level.org.springframework.cloud.gateway.route.RouteDefinitionRouteLocator=DEBUG

# ===== Gateway Dynamic Routing =====
#spring.cloud.gateway.discovery.locator.discovery.enabled=true
#spring.cloud.gateway.discovery.locator.lower-case-service-id=true
# ===== Gateway Dynamic Routing =====
spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true


# Logging consul
logging.level.org.springframework.cloud.consul=DEBUG